<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата — NEURA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><filter id='g' x='-50%25' y='-50%25' width='200%25' height='200%25'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><rect width='64' height='64' rx='14' fill='rgb(7,6,15)'/><text x='32' y='46' font-family='Menlo,Consolas,monospace' font-size='40' font-weight='700' text-anchor='middle' fill='rgb(79,227,208)' filter='url(%23g)'>N</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body class="pay-body">

<header class="header">
  <div class="wrap header__row">
    <a href="index.html" class="logo">NEURA<b>_</b></a>
    <a href="index.html#pricing" class="pay-back mono">← к тарифам</a>
  </div>
</header>

<main class="pay-wrap">
  <div class="pay-card">
    <p class="label mono" id="payLabel">Тариф</p>
    <h1 class="h2" id="payTitle">Загрузка…</h1>
    <p class="pay-desc" id="payDesc"></p>
    <div class="plan__price" id="payPrice"></div>
    <ul class="mono pay-list" id="payList"></ul>
    <label class="consent mono">
      <input type="checkbox" id="payConsent">
      Согласен(на) с <a href="oferta.html" target="_blank">офертой</a> и даю согласие на <a href="privacy.html" target="_blank">обработку персональных данных</a>
    </label>
    <a href="#" class="btn btn--fill w100" id="payBtn">Оформить заказ в WhatsApp</a>
    <p class="pay-note mono" id="payAuthNote">Оплата через Kaspi — после заявки пришлём реквизиты в WhatsApp и откроем доступ сразу после поступления денег.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="whatsapp-config.js"></script>
<script src="plans-data.js"></script>
<script src="payment.js"></script>
</body>
</html>
