<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рекламный ролик — NEURA</title>
<style>
  :root{
    --bg:#07060f; --ink:#e8e7f6; --dim:#9490bd; --faint:#54508a;
    --g:#4fe3d0; --pink:#f472c8; --violet:#9b7bff; --line-soft:rgba(155,123,255,.12);
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:#000; color:var(--ink); font-family:var(--mono);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; padding:20px; overflow:hidden;
  }
  #stage{
    width:min(100%,1120px); aspect-ratio:16/9; background:var(--bg);
    border:1px solid var(--line-soft); position:relative;
  }
  #cv{ width:100%; height:100%; display:block; }
  .bar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    padding:11px 18px; background:transparent; color:var(--ink);
    border:1px solid rgba(79,227,208,.35); cursor:pointer; transition:.25s;
  }
  button:hover:not(:disabled){ background:rgba(79,227,208,.1); border-color:var(--g); color:var(--g); }
  button:disabled{ opacity:.35; cursor:default; }
  .hint{ font-size:11px; letter-spacing:.1em; color:var(--faint); text-align:center; line-height:1.9; }
  .hint b{ color:var(--dim); font-weight:400; }
  #status{ font-size:11px; letter-spacing:.13em; color:var(--g); min-height:16px; text-transform:uppercase; }
</style>
</head>
<body>

<div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>

<div class="bar">
  <button id="play">Проиграть</button>
  <button id="rec">Записать в файл</button>
</div>
<p id="status"></p>
<p class="hint">
  25 секунд, <b>1920×1080</b>, запись в <b>.webm</b> со звуком. Не переключайтесь на другую вкладку во время записи.<br>
  Всё в кадре взято из данных сайта: <b>plans-data.js</b> и <b>course-content.js</b>.
</p>

<script src="plans-data.js"></script>
<script src="course-content.js"></script>
<script>
/* Рекламный ролик NEURA.

   Ни одного постороннего кадра: заставка — та же, что в intro.html, карточки курсов и
   обложки уроков рисуются из COURSE_CARDS, цены берутся из PLANS. То есть если поменяется
   цена или название урока на сайте — поменяется и ролик, врозь они уехать не могут.

   Техника та же, что у lesson-video.html: всё на одном canvas 1920×1080, поэтому страница
   пишет ролик сама через captureStream и сводит картинку со звуком в один файл. */

const W = 1920, H = 1080;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const MONO = "'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace";
const SANS = 'Helvetica Neue, Inter, Arial, sans-serif';

const AUDIO_URL = 'private/audio/promo-golos.mp3';
const AUDIO_AT = 2500;        // голос вступает после заставки
const AUDIO_SEC = 20.136;     // фактическая длина файла
const DURATION = 25000;

const SLOGAN = 'Сайты, видео и 3D-анимация';
const SLOGAN2 = 'с помощью нейросетей';
const DOMAIN = 'neurastudy.xyz';

/* Сцены. Держим одним списком, чтобы правка ритма не лезла в код отрисовки.
   Границы подогнаны под фразы диктора: слоган звучит на второй сцене, перечисление
   уроков — на третьей и четвёртой, цена — на пятой. */
const SC = {
  intro:   [0, 4200],
  slogan:  [2500, 7000],
  cards:   [6600, 13600],
  covers:  [13200, 17400],
  price:   [17000, 21600],
  domain:  [21200, 25000]
};

const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
const at = (t, [a, b]) => clamp01((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
// Плавное появление и уход: сцены перекрываются по краям, поэтому нужен «конверт».
const env = (t, [a, b], fade) => {
  const inP = clamp01((t - a) / fade);
  const outP = clamp01((b - t) / fade);
  return Math.min(inP, outP);
};

/* ---------- дождь (механика из intro.html) ---------- */
const GLYPHS = '0101101001ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789';
const SCRAMBLE = '01ｱｲｳｴｵｶｷｸ█▓#%&';
const pick = (s) => s[(Math.random() * s.length) | 0];
const SIZE = 26, STEP = SIZE + 5, MAX_DROPS = 64;
let drops = [];

function resetRain() {
  drops = [];
  for (let i = 0; i < MAX_DROPS; i++) {
    drops.push({
      x: Math.round((Math.random() * W) / STEP) * STEP,
      y: Math.random() * H,
      v: 2.2 + Math.random() * 4.4,
      chars: Array.from({ length: 10 + ((Math.random() * 16) | 0) }, () => pick(GLYPHS)),
      life: 0.45 + Math.random() * 0.55,
      decay: 0.0016
    });
  }
}

function drawRain(alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = SIZE + 'px ' + MONO;
  ctx.textBaseline = 'top';
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.y += d.v;
    d.life -= d.decay;
    if (d.life <= 0 || d.y - d.chars.length * STEP > H) {
      drops[i] = {
        x: Math.round((Math.random() * W) / STEP) * STEP,
        y: -Math.random() * H * 0.5, v: 2.2 + Math.random() * 4.4,
        chars: Array.from({ length: 10 + ((Math.random() * 16) | 0) }, () => pick(GLYPHS)),
        life: 1, decay: 0.0016
      };
      continue;
    }
    if (Math.random() < 0.22) d.chars[(Math.random() * d.chars.length) | 0] = pick(GLYPHS);
    for (let j = 0; j < d.chars.length; j++) {
      const y = d.y - j * STEP;
      if (y < -SIZE || y > H) continue;
      const a = (1 - j / d.chars.length) * d.life * 0.52;
      if (j === 0) {
        ctx.fillStyle = 'rgba(232,241,255,' + Math.min(1, a * 1.5) + ')';
        ctx.shadowColor = 'rgba(79,227,208,0.9)';
        ctx.shadowBlur = 10;
      } else {
        const k = j / d.chars.length;
        ctx.fillStyle = 'rgba(' + Math.round(79 + 76 * k) + ',' + Math.round(227 - 104 * k) +
          ',' + Math.round(208 + 47 * k) + ',' + (a * 0.72) + ')';
        ctx.shadowBlur = 0;
      }
      ctx.fillText(d.chars[j], d.x, y);
    }
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

/* ---------- утилиты текста ---------- */
function measureTracked(text, size, sp) {
  ctx.font = size + 'px ' + MONO;
  return [...text].reduce((s, c) => s + ctx.measureText(c).width, 0) + sp * (text.length - 1);
}
function drawTracked(text, left, y, size, sp, color, glow) {
  ctx.font = size + 'px ' + MONO;
  let x = left;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 34; }
  [...text].forEach((c) => { ctx.fillText(c, x, y); x += ctx.measureText(c).width + sp; });
  ctx.shadowBlur = 0;
  return x - left - sp;
}
function decoded(text, p) {
  if (p >= 1) return text;
  const n = Math.floor(text.length * p);
  let out = text.slice(0, n);
  for (let i = n; i < text.length; i++) out += text[i] === ' ' ? ' ' : pick(SCRAMBLE);
  return out;
}
function centered(text, y, size, color, weight) {
  ctx.font = (weight || '300 ') + size + 'px ' + SANS;
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
  ctx.textAlign = 'left';
}

function scrim(strength) {
  const g = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, W * 0.66);
  g.addColorStop(0, 'rgba(7,6,15,' + strength + ')');
  g.addColorStop(1, 'rgba(7,6,15,' + (strength * 0.35) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- сцены ---------- */

function sceneIntro(t) {
  const p = at(t, [600, 2400]);
  if (p <= 0) return;
  const SZ = 150, SP = 34;
  const left = W / 2 - measureTracked('NEURA_', SZ, SP) / 2;
  const used = drawTracked(decoded('NEURA', p), left, 520, SZ, SP, '#e8e7f6',
    'rgba(79,227,208,' + (0.55 * p) + ')');
  if (p > 0.55) {
    ctx.font = SZ + 'px ' + MONO;
    ctx.fillStyle = 'rgba(79,227,208,' + clamp01((p - 0.55) / 0.45) + ')';
    ctx.fillText('_', left + used + SP, 520);
  }
  const r = easeOut(at(t, [2000, 2900]));
  if (r > 0) {
    ctx.fillStyle = '#f472c8';
    ctx.fillRect(W / 2 - 250 * r, 582, 500 * r, 3);
  }
}

function sceneSlogan(t) {
  const a = env(t, SC.slogan, 500);
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(0, (1 - easeOut(at(t, [SC.slogan[0], SC.slogan[0] + 600]))) * 24);
  centered(SLOGAN, 500, 88, '#e8e7f6');
  centered(SLOGAN2, 610, 88, '#4fe3d0');
  ctx.restore();
}

// Карточки курсов — те же три, что в кабинете, с теми же названиями и диапазонами.
function drawCard(x, y, w, h, card, locked, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(18,14,38,.72)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = locked ? 'rgba(155,123,255,.22)' : 'rgba(79,227,208,.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);

  // Кегль заголовка подбирается под ширину карточки: «Упаковка под площадки»
  // при 40px не помещается в поле и вылезает за рамку.
  let ts = 40;
  do { ctx.font = '300 ' + ts + 'px ' + SANS; ts -= 2; }
  while (ctx.measureText(card.title).width > w - 80 && ts > 24);
  ctx.fillStyle = locked ? '#9490bd' : '#e8e7f6';
  ctx.fillText(card.title, x + 40, y + 84);

  ctx.font = '22px ' + MONO;
  ctx.fillStyle = locked ? '#54508a' : '#4fe3d0';
  ctx.fillText(card.range.toUpperCase(), x + 40, y + 132);

  const n = card.stages.reduce((s, st) => s + st.lessons.length, 0);
  ctx.font = '300 26px ' + SANS;
  ctx.fillStyle = '#9490bd';
  ctx.fillText(n + ' уроков', x + 40, y + 190);

  if (locked) {
    // Тот же пиксельный замок, что на закрытых карточках кабинета.
    const px = 5, ox = x + w - 78, oy = y + 44;
    ctx.fillStyle = '#54508a';
    const R = (a, b, c, d) => ctx.fillRect(ox + a * px, oy + b * px, c * px, d * px);
    R(2, 0, 4, 1); R(2, 1, 1, 3); R(5, 1, 1, 3);
    R(0, 4, 8, 5); ctx.fillStyle = '#07060f'; R(3, 6, 2, 2);
  }
  ctx.restore();
}

function sceneCards(t) {
  const a = env(t, SC.cards, 500);
  if (a <= 0) return;
  const w = 520, h = 300, gap = 40;
  const totalW = w * 3 + gap * 2;
  let x = W / 2 - totalW / 2;
  COURSE_CARDS.forEach((card, i) => {
    const p = easeOut(clamp01((t - (SC.cards[0] + i * 320)) / 700));
    if (p > 0) {
      ctx.save();
      ctx.translate(0, (1 - p) * 30);
      drawCard(x, 470, w, h, card, i > 0, a * p);
      ctx.restore();
    }
    x += w + gap;
  });
  ctx.save();
  ctx.globalAlpha = a;
  centered('Личный кабинет: купленный курс открыт, остальные — под замком', 900, 34, '#9490bd');
  ctx.restore();
}

// Обложка урока — та же композиция, что рисует renderLessonCover() в кабинете.
function drawCover(x, y, w, lesson, stageTitle, alpha) {
  const h = w * 9 / 16;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#07060f';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(155,123,255,.18)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  const s = w / 1600;
  ctx.font = (26 * s) + 'px ' + MONO;
  ctx.fillStyle = '#54508a';
  ctx.fillText('УРОК', x + 120 * s, y + 196 * s);
  ctx.font = (150 * s) + 'px ' + MONO;
  ctx.fillStyle = '#4fe3d0';
  ctx.fillText(String(lesson.n).padStart(2, '0'), x + 120 * s, y + 368 * s);
  ctx.fillStyle = '#f472c8';
  ctx.fillRect(x + 120 * s, y + 410 * s, 118 * s, 3 * s);
  ctx.font = '300 ' + (66 * s) + 'px ' + SANS;
  ctx.fillStyle = '#e8e7f6';
  const words = lesson.title.split(' ');
  let line = '', ly = y + 524 * s;
  words.forEach((word) => {
    const next = line ? line + ' ' + word : word;
    if (ctx.measureText(next).width > w - 240 * s && line) {
      ctx.fillText(line, x + 120 * s, ly); line = word; ly += 82 * s;
    } else line = next;
  });
  if (line) ctx.fillText(line, x + 120 * s, ly);
  ctx.font = (23 * s) + 'px ' + MONO;
  ctx.fillStyle = '#54508a';
  ctx.fillText(stageTitle.toUpperCase(), x + 120 * s, y + 812 * s);
  ctx.restore();
}

// Лента обложек едет справа налево — показывает объём курса, а не один кадр.
const STRIP = [];
COURSE_CARDS.forEach((c) => c.stages.forEach((st) => st.lessons.forEach((l) => STRIP.push({ l, st: st.title }))));

function sceneCovers(t) {
  const a = env(t, SC.covers, 450);
  if (a <= 0) return;
  const p = at(t, SC.covers);
  const cw = 470, gap = 34;
  const offset = -p * (cw + gap) * 5;
  ctx.save();
  ctx.globalAlpha = a;
  for (let i = 0; i < 9; i++) {
    const item = STRIP[(i + 4) % STRIP.length];
    const x = 120 + i * (cw + gap) + offset;
    if (x > W || x + cw < 0) continue;
    drawCover(x, 400, cw, item.l, item.st, 1);
  }
  centered('Без кода и без команды — только вы и нейросети', 930, 40, '#e8e7f6');
  ctx.restore();
}

function scenePrice(t) {
  const a = env(t, SC.price, 450);
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  centered('Полный курс', 400, 40, '#9490bd');

  const plan = PLANS.full;
  ctx.textAlign = 'center';
  ctx.font = '300 64px ' + SANS;
  ctx.fillStyle = '#54508a';
  const oldW = ctx.measureText(plan.oldPrice).width;
  ctx.fillText(plan.oldPrice, W / 2, 530);
  ctx.strokeStyle = '#54508a';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(W / 2 - oldW / 2, 512);
  ctx.lineTo(W / 2 + oldW / 2, 512);
  ctx.stroke();

  ctx.font = '300 132px ' + SANS;
  ctx.fillStyle = '#4fe3d0';
  ctx.fillText(plan.newPrice, W / 2, 680);
  ctx.textAlign = 'left';

  const bw = 420, bx = W / 2 - bw / 2;
  ctx.strokeStyle = '#f472c8';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, 740, bw, 76);
  centered('−50% ПО ТАЙМЕРУ НА САЙТЕ', 790, 28, '#f472c8', '400 ');
  ctx.restore();
}

function sceneDomain(t) {
  const a = env(t, SC.domain, 500);
  if (a <= 0) return;
  const p = at(t, [SC.domain[0], SC.domain[0] + 700]);
  ctx.save();
  ctx.globalAlpha = a;
  const SZ = 92, SP = 14;
  drawTracked(decoded(DOMAIN, p), W / 2 - measureTracked(DOMAIN, SZ, SP) / 2, 560, SZ, SP,
    '#4fe3d0', 'rgba(79,227,208,.45)');
  const SZ2 = 34, SP2 = 10;
  drawTracked('NEURA_', W / 2 - measureTracked('NEURA_', SZ2, SP2) / 2, 660, SZ2, SP2, '#54508a', null);
  ctx.restore();
}

function drawFrame(t) {
  ctx.fillStyle = '#07060f';
  ctx.fillRect(0, 0, W, H);

  // Дождь идёт под всем роликом: ярко на заставке, дальше приглушённым фоном.
  const rainA = t < SC.intro[1] ? easeOut(at(t, [0, 900]))
    : Math.max(0.16, 1 - at(t, [SC.intro[1], SC.intro[1] + 900]) * 0.84);
  drawRain(rainA);
  scrim(t < SC.intro[1] ? 0.86 : 0.93);

  sceneIntro(t);
  sceneSlogan(t);
  sceneCards(t);
  sceneCovers(t);
  scenePrice(t);
  sceneDomain(t);

  const out = at(t, [DURATION - 700, DURATION]);
  if (out > 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + easeOut(out) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- звук, проигрывание и запись ---------- */
const playBtn = document.getElementById('play');
const recBtn = document.getElementById('rec');
const status = document.getElementById('status');
let running = false, spoiled = false;
let audioEl = null, audioCtx = null, audioDest = null;

document.addEventListener('visibilitychange', () => { if (document.hidden && running) spoiled = true; });

function ensureAudio() {
  if (!audioEl) {
    audioEl = new Audio(AUDIO_URL);
    audioEl.preload = 'auto';
  }
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    const src = audioCtx.createMediaElementSource(audioEl);
    audioDest = audioCtx.createMediaStreamDestination();
    src.connect(audioDest);
    src.connect(audioCtx.destination);
  }
  return audioEl;
}

function run(onDone) {
  if (running) return;
  running = true;
  playBtn.disabled = recBtn.disabled = true;
  resetRain();

  const a = ensureAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  a.currentTime = 0;
  let started = false;

  const t0 = performance.now();
  (function loop(now) {
    const t = now - t0;
    // Голос вступает после заставки, поэтому запускаем его по таймлайну, а не сразу.
    if (!started && t >= AUDIO_AT) { started = true; a.play().catch(() => {}); }
    drawFrame(Math.min(t, DURATION));
    if (t < DURATION) { requestAnimationFrame(loop); return; }
    a.pause();
    running = false;
    playBtn.disabled = recBtn.disabled = false;
    if (onDone) onDone();
  })(t0);
}

playBtn.addEventListener('click', () => { status.textContent = ''; run(); });

recBtn.addEventListener('click', () => {
  if (!window.MediaRecorder || !cv.captureStream) {
    status.textContent = 'Браузер не умеет записывать — откройте в Chrome';
    return;
  }
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
    .find((m) => MediaRecorder.isTypeSupported(m));
  if (!mime) { status.textContent = 'Формат записи не поддерживается'; return; }

  const chunks = [];
  const stream = cv.captureStream(60);
  ensureAudio();
  audioDest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'neura-reklama-25s.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    status.textContent = 'Готово — файл скачан';
  };

  spoiled = false;
  status.textContent = 'Идёт запись… не переключайтесь на другую вкладку';
  rec.start();
  run(() => setTimeout(() => {
    if (spoiled) {
      rec.onstop = () => { status.textContent = 'Дубль испорчен — вкладка уходила в фон. Запишите заново'; };
    }
    rec.stop();
  }, 250));
});

resetRain();
drawFrame(SC.cards[0] + 1200);
</script>
</body>
</html>
